name: Stash tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stash-tests:
    name: Stash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:node
      - run: npm run test:browser
